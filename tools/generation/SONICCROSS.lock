# SonicCross generation lock — the frozen, reproducible inputs for the
# native-torch C++ sources that SonicCross generates at build time into the
# build directory (matching upstream PyTorch's build-time torchgen). Generated
# sources are gitignored and never committed.
#
# Do not bump any of these without an explicit migration/generation decision.
# Regenerating from different inputs will not be byte-identical.

# Upstream PyTorch source reference (torchgen input origin).
pytorch_repository = pytorch/pytorch
pytorch_branch     = release/2.14
pytorch_commit     = 41ffbc4a994e058af9fe00ed5caba73fc1033359
pytorch_version    = 2.14.1a0

# SonicCross — the build-time torchgen replacement that produced the baseline.
soniccross_version = v0.0.1
soniccross_commit  = e3acee5afede1b63074f1aa6f9622c90eb3b0bd4

# Generation input snapshot (no full PyTorch checkout required).
native_functions_yaml        = tools/generation/native/native_functions.yaml
native_functions_yaml_sha256 = d68d30699549d4b75ed0a8765a9a29663e7d7be7a25e381a40f6ce72ad2d3060

# tags.yaml is NOT a file: SonicCross embeds the frozen valid-tags constant
# (native-function.scm). There is nothing to snapshot or pin here.
tags_yaml = embedded-in-soniccross

# Generation invocation. The destination is the `ATen/` parent inside the build
# directory: SonicCross emits Functions.h / core/ / ops/ flat relative to -d,
# and every generated source #includes <ATen/...>, so -d must be the `ATen/`
# parent (resolved against the include root `${ATEN_GENERATED_DIR}`).
# --per-operator-headers additionally emits the per-op split headers under ops/
# + per-op Register{key}.cpp.
generate_command = guild torchgen -s tools/generation \
                   -d ${ATEN_GENERATED_DIR}/ATen \
                   --per-operator-headers \
                   --generate headers,sources
generated_output  = ${ATEN_GENERATED_DIR}/ATen/   (build dir; gitignored, not committed)
generate_subsets  = headers,sources
